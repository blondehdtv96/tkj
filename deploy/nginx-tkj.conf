# Server block untuk TKJ Learning di belakang Cloudflare Tunnel.
# Salin ke /etc/nginx/sites-available/tkj lalu symlink ke sites-enabled.
#
# cloudflared berjalan di mesin yang sama dan meneruskan ke 127.0.0.1:80,
# jadi TLS ditangani Cloudflare dan nginx cukup mendengarkan HTTP lokal.

server {
    listen 127.0.0.1:80;
    listen [::1]:80;

    # Ganti dengan domain yang dipakai di Cloudflare.
    server_name tkj.sekolah.sch.id;

    root /var/www/tkj/public;
    index index.php;

    charset utf-8;

    # Materi boleh diunggah sampai 50 MB (lihat MateriRequest).
    # Nilai ini harus sejalan dengan upload_max_filesize dan post_max_size di PHP.
    client_max_body_size 64M;

    # Vue Router memakai history mode: seluruh path non-file dilempar ke index.php,
    # dan routes/web.php mengembalikan app.blade.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Aset hasil build Vite diberi hash pada namanya sehingga aman di-cache lama.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # Sesuaikan versi PHP bila CT memakai selain 8.3.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Export Excel pada bab besar bisa berjalan lebih dari 60 detik.
        fastcgi_read_timeout 300;
    }

    # Jangan layani berkas tersembunyi, kecuali ACME bila suatu saat memakai Certbot.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/tkj-access.log;
    error_log  /var/log/nginx/tkj-error.log;
}
